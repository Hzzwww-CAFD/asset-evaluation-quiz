button,input,select { font:inherit; }
.app { min-height:100vh; display:grid; grid-template-columns:280px minmax(0,1fr) 310px; }
.sidebar { border-right:1px solid var(--line); background:rgba(255,250,240,.82); padding:22px 18px; display:flex; flex-direction:column; gap:18px; }
.brand { display:flex; flex-direction:column; gap:8px; padding:2px 4px 10px; }
.brand h1 { margin:0; font-size:24px; line-height:1.18; font-weight:800; }
.brand .sub { color:var(--muted); font-size:13px; }
.nav { display:grid; gap:8px; }
.nav button { width:100%; border:1px solid transparent; background:transparent; color:var(--ink); display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; padding:11px 12px; border-radius:8px; cursor:pointer; text-align:left; }
.nav button:hover { background:#f1eadc; }
.nav button.active { background:#e7f0ec; border-color:#aac9c4; color:var(--teal-dark); }
.nav small { color:var(--muted); }
.nav .wrong-tab { margin-top:8px; border-color:#e4c1b9; background:#fff5f1; }
.nav .star-tab { border-color:#e0c783; background:#fff8df; }
.nav .exam-tab { margin-top:8px; border-color:#aac9c4; background:#eef8f5; }
.main { min-width:0; padding:26px 34px; display:flex; flex-direction:column; gap:20px; }
.toolbar { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.title-block h2 { margin:0; font-size:27px; line-height:1.15; }
.title-block p { margin:7px 0 0; color:var(--muted); font-size:14px; }
.actions { display:flex; gap:10px; flex-wrap:wrap; }
.btn { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:10px 13px; cursor:pointer; min-height:40px; }
.btn:hover { border-color:#aeb8ad; }
.btn.primary { background:var(--teal); color:white; border-color:var(--teal); }
.btn.primary:disabled, .btn:disabled { opacity:.55; cursor:not-allowed; }
.btn.warn { color:var(--red); border-color:#e0b5ae; }
.question-shell { background:rgba(255,250,240,.92); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); padding:24px; display:grid; gap:18px; }
.question-meta { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:14px; }
.question-text { font-size:22px; line-height:1.7; font-weight:700; }
.options { display:grid; gap:11px; }
.option { border:1px solid var(--line); border-radius:8px; background:#fffdf7; display:grid; grid-template-columns:44px 1fr; align-items:stretch; min-height:58px; cursor:pointer; overflow:hidden; }
.option .letter { display:grid; place-items:center; background:var(--gray); color:var(--teal-dark); font-weight:800; }
.option .text { padding:14px 16px; line-height:1.55; }
.option:hover { border-color:#a8b6b2; }
.option.correct { border-color:var(--green); background:var(--green-soft); }
.option.correct .letter { background:var(--green); color:white; }
.option.wrong { border-color:var(--red); background:var(--red-soft); }
.option.wrong .letter { background:var(--red); color:white; }
.feedback { min-height:48px; white-space:pre-line; border-left:4px solid var(--line); padding:8px 0 8px 14px; line-height:1.65; color:var(--muted); }
.feedback.good { border-color:var(--green); color:#1d5d39; }
.feedback.bad { border-color:var(--red); color:#8e332b; }
.question-actions { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.question-actions .left-actions { display:flex; gap:10px; flex-wrap:wrap; }
.btn.starred { border-color:#d3a327; background:#fff4cf; color:#7c5510; }
.star-mark { color:#b37b37; font-weight:800; margin-left:6px; }
.progressbar { height:10px; background:#e7dece; border-radius:999px; overflow:hidden; }
.progressbar div { height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--gold)); transition:width .25s ease; }
.sidepanel { border-left:1px solid var(--line); background:rgba(255,250,240,.76); padding:24px 20px; display:grid; align-content:start; gap:18px; }
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat { border:1px solid var(--line); border-radius:8px; padding:12px; background:#fffdf7; }
.stat strong { display:block; font-size:24px; line-height:1; }
.stat span { display:block; margin-top:6px; color:var(--muted); font-size:12px; }
.list { display:grid; gap:8px; max-height:48vh; overflow:auto; padding-right:4px; }
.list button { border:1px solid var(--line); background:#fffdf7; border-radius:8px; padding:10px; text-align:left; cursor:pointer; }
.list button:hover { border-color:var(--teal); }
.list button.current { border-color:var(--teal); background:#e7f0ec; }
.rate { color:var(--red); font-weight:700; }
.empty { border:1px dashed var(--line); border-radius:8px; padding:28px; text-align:center; color:var(--muted); background:rgba(255,253,247,.66); }
.kicker { color:var(--muted); font-size:13px; text-transform:uppercase; }
@media (max-width:1120px) { .app { grid-template-columns:220px minmax(0,1fr); } .sidepanel { grid-column:1/-1; border-left:0; border-top:1px solid var(--line); grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:780px) { .app { display:block; } .sidebar { border-right:0; border-bottom:1px solid var(--line); } .nav { grid-template-columns:repeat(2,minmax(0,1fr)); } .main { padding:22px 16px; } .sidepanel { padding:18px 16px; display:grid; } .question-shell { padding:18px; } .question-text { font-size:19px; } .option { grid-template-columns:38px 1fr; } }
</style>
</head>

const DATA = [{"chapter":1,"title":"第一章 导论","questions":[{"id":"ch1-q1","chapter":1,"number":1,"question":"资产评估的时点性是指以被评估资产在（）的实际状况，对资产价值进行的评定估算。","options":{"A":"评估日期","B":"评估工作日期","C":"评估基准日","D":"过去、现在及未来"},"answer":"C","explanation":"解题思路：\n- 评估基准日是资产价值成立和资产状态被锁定的具体时点。\n- 题干问的是“资产评估的时点性是指以被评估资产在（）的实际状况，对资产价值进行的评定估算。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 评估日期：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 评估工作日期：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 评估基准日：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- D. 过去、现在及未来：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch1-q2","chapter":1,"number":2,"question":"不可辨认的资产是指（）。","options":{"A":"没有物质形态因而无法辨认的资产","B":"因不具有综合获利能力而无法单独出售的资产","C":"不能独立于有形资产而单独存在的资产","D":"除有形资产以外的所有资产"},"answer":"C","explanation":"解题思路：\n- 不可辨认资产不能独立于有形资产单独存在，典型是商誉。\n- 题干问的是“不可辨认的资产是指（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 没有物质形态因而无法辨认的资产：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 因不具有综合获利能力而无法单独出售的资产：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 不能独立于有形资产而单独存在的资产：正确。不可辨认资产不能独立于有形资产单独存在，典型是商誉。该选项与题干关键词直接对应。\n- D. 除有形资产以外的所有资产：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch1-q3","chapter":1,"number":3,"question":"资产评估价值取决于资产的（）。","options":{"A":"原先的购买价格","B":"生产成本","C":"预期效用","D":"评估基准日的利用现状"},"answer":"C","explanation":"解题思路：\n- 评估基准日是资产价值成立和资产状态被锁定的具体时点。\n- 题干问的是“资产评估价值取决于资产的（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 原先的购买价格：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 生产成本：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 预期效用：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- D. 评估基准日的利用现状：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch1-q4","chapter":1,"number":4,"question":"在正常情况下，一栋别墅在某一时点的市场价值，不会高于此时点重新开发一同等效用别墅的成本（包括利润）。这体现了资产评估的（）。","options":{"A":"贡献原则","B":"最佳使用原则","C":"预期原则","D":"替代原则"},"answer":"D","explanation":"解题思路：\n- 替代原则强调理性购买者不会支付超过同等效用替代资产成本的价格。\n- 题干问的是“在正常情况下，一栋别墅在某一时点的市场价值，不会高于此时点重新开发一同等效用别墅的成本（包括利润）。这体现了资产评估的（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 贡献原则：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 最佳使用原则：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 预期原则：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 替代原则：正确。替代原则强调理性购买者不会支付超过同等效用替代资产成本的价格。该选项与题干关键词直接对应。"},{"id":"ch1-q5","chapter":1,"number":5,"question":"以某单项资产对整体资产的贡献为依据.所评估的是该资产的（）。","options":{"A":"市场价值","B":"投资价值","C":"残余价值","D":"在用价值"},"answer":"D","explanation":"解题思路：\n- 在用价值强调资产作为企业整体组成部分继续使用时对整体的贡献。\n- 题干问的是“以某单项资产对整体资产的贡献为依据.所评估的是该资产的（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 市场价值：不选。市场价值强调公开市场交换价格，不等同于题干所问的特定用途、清算、贡献或个别投资者价值。\n- B. 投资价值：不选。投资价值是特定投资者基于自身条件得到的价值，题干若没有特定投资者条件就不能选。\n- C. 残余价值：不选。残余价值多用于报废、清算或处置后剩余价值，题干不属于该处置口径。\n- D. 在用价值：正确。在用价值强调资产作为企业整体组成部分继续使用时对整体的贡献。该选项与题干关键词直接对应。"},{"id":"ch1-q6","chapter":1,"number":6,"question":"在企业兼并时，目标企业（被兼并企业）价值评估的最适用假设是（）。","options":{"A":"清算假设","B":"公开市场假设","C":"特别假设","D":"持续经营假设"},"answer":"D","explanation":"解题思路：\n- 持续经营假设适用于企业作为经营整体继续存在、继续获利的情形。\n- 题干问的是“在企业兼并时，目标企业（被兼并企业）价值评估的最适用假设是（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 清算假设：不选。清算假设用于迫售或停止经营，题干若是正常交易或持续经营就不能选。\n- B. 公开市场假设：不选。公开市场假设要求正常、充分竞争的自愿交易，题干若有强制处置或特定用途限制就不能选。\n- C. 特别假设：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 持续经营假设：正确。持续经营假设适用于企业作为经营整体继续存在、继续获利的情形。该选项与题干关键词直接对应。"},{"id":"ch1-q7","chapter":1,"number":7,"question":"银行在因债务不能清偿而需要对其受押的抵押房地产进行处置时，该抵押房地产价值的评估适用于（）。","options":{"A":"清算假设","B":"公开市场假设","C":"持续使用假设","D":"非真实性假设"},"answer":"A","explanation":"解题思路：\n- 清算假设适用于被迫出售、偿债处置、停用报废等非正常持续使用情形。\n- 题干问的是“银行在因债务不能清偿而需要对其受押的抵押房地产进行处置时，该抵押房地产价值的评估适用于（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 A。\n选项辨析：\n- A. 清算假设：正确。清算假设适用于被迫出售、偿债处置、停用报废等非正常持续使用情形。该选项与题干关键词直接对应。\n- B. 公开市场假设：不选。公开市场假设要求正常、充分竞争的自愿交易，题干若有强制处置或特定用途限制就不能选。\n- C. 持续使用假设：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 非真实性假设：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch1-q8","chapter":1,"number":8,"question":"资产评估价值与资产交易中的实际成交价格之间的关系是（）。","options":{"A":"前者必须高于后者","B":"前者必须低于后者","C":"前者必须等于后者","D":"前者可以高于.低于或者等于后者"},"answer":"D","explanation":"解题思路：\n- 本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。\n- 题干问的是“资产评估价值与资产交易中的实际成交价格之间的关系是（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 前者必须高于后者：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 前者必须低于后者：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 前者必须等于后者：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 前者可以高于.低于或者等于后者：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。"},{"id":"ch1-q9","chapter":1,"number":9,"question":"公开市场假设下所评估资产的价值类型是（）。","options":{"A":"投资价值","B":"市场价值","C":"在用价值","D":"残余价值"},"answer":"B","explanation":"解题思路：\n- 在用价值强调资产作为企业整体组成部分继续使用时对整体的贡献。\n- 题干问的是“公开市场假设下所评估资产的价值类型是（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 B。\n选项辨析：\n- A. 投资价值：不选。投资价值是特定投资者基于自身条件得到的价值，题干若没有特定投资者条件就不能选。\n- B. 市场价值：正确。在用价值强调资产作为企业整体组成部分继续使用时对整体的贡献。该选项与题干关键词直接对应。\n- C. 在用价值：不选。在用价值强调继续使用和整体贡献，题干若不是持续使用贡献口径就不能选。\n- D. 残余价值：不选。残余价值多用于报废、清算或处置后剩余价值，题干不属于该处置口径。"},{"id":"ch1-q10","chapter":1,"number":10,"question":"某一宗土地用于住宅开发时的价值为300万元，用于商业大楼开发时的价值为500万元，用于工业厂房开发时的价值为280万元。城市规划确认该土地可用于住宅或工业生产。该宗土地的价值应评估为（）万元。","options":{"A":"500","B":"300","C":"280","D":"360"},"answer":"B","explanation":"解题思路：\n- 本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。\n- 题干问的是“某一宗土地用于住宅开发时的价值为300万元，用于商业大楼开发时的价值为500万元，用于工业厂房开发时的价值为280万元。城市规划确认该土地可用于住宅或工业生产。该宗土地的价值应评估为（）万元。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 B。\n选项辨析：\n- A. 500：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 300：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- C. 280：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 360：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch1-q11","chapter":1,"number":11,"question":"同一资产在两种不同评估目的下，所选择的价值类型应该（）。","options":{"A":"相同","B":"不相同","C":"接近","D":"无法确定"},"answer":"D","explanation":"解题思路：\n- 评估目的决定价值类型和评估口径，是选择价值类型的业务基础。\n- 题干问的是“同一资产在两种不同评估目的下，所选择的价值类型应该（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 相同：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 不相同：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 接近：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 无法确定：正确。评估目的决定价值类型和评估口径，是选择价值类型的业务基础。该选项与题干关键词直接对应。"},{"id":"ch1-q12","chapter":1,"number":12,"question":"评估基准日的选择应尽可能接近（）。","options":{"A":"评估委托合同签订日期","B":"评估工作日期","C":"评估目的实现日期","D":"评估报告提交日期"},"answer":"C","explanation":"解题思路：\n- 评估基准日是资产价值成立和资产状态被锁定的具体时点。\n- 题干问的是“评估基准日的选择应尽可能接近（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 评估委托合同签订日期：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 评估工作日期：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 评估目的实现日期：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- D. 评估报告提交日期：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch1-q13","chapter":1,"number":13,"question":"决定资产评估价值类型选择的资产评估业务基础是（）。","options":{"A":"评估方法","B":"评估对象","C":"评估基准日","D":"评估目的"},"answer":"D","explanation":"解题思路：\n- 评估基准日是资产价值成立和资产状态被锁定的具体时点。\n- 题干问的是“决定资产评估价值类型选择的资产评估业务基础是（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 评估方法：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 评估对象：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 评估基准日：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 评估目的：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。"},{"id":"ch1-q14","chapter":1,"number":14,"question":"某设备作为被评估企业的一项要素资产，在按现状持续经营假设前提下，其评估价值是该设备的（）。","options":{"A":"最佳使用价值","B":"正常变现价值","C":"快速变现价值","D":"对企业的贡献价值"},"answer":"D","explanation":"解题思路：\n- 持续经营假设适用于企业作为经营整体继续存在、继续获利的情形。\n- 题干问的是“某设备作为被评估企业的一项要素资产，在按现状持续经营假设前提下，其评估价值是该设备的（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 最佳使用价值：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 正常变现价值：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 快速变现价值：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 对企业的贡献价值：正确。持续经营假设适用于企业作为经营整体继续存在、继续获利的情形。该选项与题干关键词直接对应。"},{"id":"ch1-q15","chapter":1,"number":15,"question":"国家环保产业政策的实施导致某企业因设备老旧需要关停，对这些老旧设备的评估应选择的价值类型为（）。","options":{"A":"市场价值","B":"在用价值","C":"残余价值","D":"投资价值"},"answer":"C","explanation":"解题思路：\n- 在用价值强调资产作为企业整体组成部分继续使用时对整体的贡献。\n- 题干问的是“国家环保产业政策的实施导致某企业因设备老旧需要关停，对这些老旧设备的评估应选择的价值类型为（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 市场价值：不选。市场价值强调公开市场交换价格，不等同于题干所问的特定用途、清算、贡献或个别投资者价值。\n- B. 在用价值：不选。在用价值强调继续使用和整体贡献，题干若不是持续使用贡献口径就不能选。\n- C. 残余价值：正确。在用价值强调资产作为企业整体组成部分继续使用时对整体的贡献。该选项与题干关键词直接对应。\n- D. 投资价值：不选。投资价值是特定投资者基于自身条件得到的价值，题干若没有特定投资者条件就不能选。"}]},{"chapter":2,"title":"第二章 资产评估的程序与基本方法","questions":[{"id":"ch2-q1","chapter":2,"number":1,"question":"被评估宾馆因市场原因，在未来3年内每年收益净损失额约为5万元，假定折现率为10%，该宾馆的经济性贬值最接近于（）万元。","options":{"A":"15","B":"12.6","C":"10","D":"50"},"answer":"B","explanation":"解题思路：\n- 经济性贬值=每年收益净损失额5万元 × 年金现值系数(P/A,10%,3)。系数= [1-1/(1+10%)^3]/10% = 2.4869，所以5×2.4869=12.43万元，最接近12.6万元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 15：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 12.6：正确。经济性贬值来自外部市场、政策、需求等因素导致的价值损失。该选项与题干关键词直接对应。\n- C. 10：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 50：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch2-q2","chapter":2,"number":2,"question":"用价格指数法估算的资产成本是资产的（）。","options":{"A":"复原重置成本","B":"既可以是复原重置成本，也可以是更新重置成本","C":"更新重置成本","D":"既不是复原重置成本，也不是更新重置成本"},"answer":"A","explanation":"解题思路：\n- 价格指数法只是把历史成本调整到现时价格水平，通常得到复原重置成本。\n- 题干问的是“用价格指数法估算的资产成本是资产的（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 A。\n选项辨析：\n- A. 复原重置成本：正确。价格指数法只是把历史成本调整到现时价格水平，通常得到复原重置成本。该选项与题干关键词直接对应。\n- B. 既可以是复原重置成本.也可以是更新重置成本：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 更新重置成本：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 既不是复原重置成本.也不是更新重置成本：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch2-q3","chapter":2,"number":3,"question":"某项资产2010年购建，账面原值为100000元，2019年进行评估，若以购建时价格指数为100%，则3年间同类资产环比价格指数分别为110%、120%、115%，该项资产的重置成本应为（）。","options":{"A":"145000)元。","B":"115000","C":"152000","D":"151800"},"answer":"D","explanation":"解题思路：\n- 价格指数法用账面原值乘以后续价格指数：100000×110%×120%×115%=151800元。\n- 因此正确答案是 D。\n选项辨析：\n- A. 145000)元。：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 115000：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 152000：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 151800：正确。价格指数法只是把历史成本调整到现时价格水平，通常得到复原重置成本。该选项与题干关键词直接对应。"},{"id":"ch2-q4","chapter":2,"number":4,"question":"某被评估资产2010年购建，账面价值为50万元，2019年进行评估，2010年、2019年该类资产的定基价格指数分别为120%、170%，则被评估资产的重置成本为（）万元。","options":{"A":"50","B":"70.8","C":"35.3","D":"85"},"answer":"B","explanation":"解题思路：\n- 定基指数换算：重置成本=账面价值×评估基准日指数/购建时指数=50×170%/120%=70.83万元，最接近70.8万元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 50：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 70.8：正确。价格指数法只是把历史成本调整到现时价格水平，通常得到复原重置成本。该选项与题干关键词直接对应。\n- C. 35.3：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 85：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch2-q5","chapter":2,"number":5,"question":"某设备的年收益额为50万元，适用资本化率为20%，则该设备的收益现值为（）万元。","options":{"A":"200","B":"250","C":"300","D":"350"},"answer":"B","explanation":"解题思路：\n- 收益现值在稳定永续收益下可用资本化公式：价值=年收益额/资本化率=50/20%=250万元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 200：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 250：正确。资本化率用于把稳定收益转化为价值，收益越高、资本化率越低，价值越高。该选项与题干关键词直接对应。\n- C. 300：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 350：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch2-q6","chapter":2,"number":6,"question":"教堂、学校、专用机器设备等资产的价值评估，一般适宜选用（）。","options":{"A":"成本法","B":"收益法","C":"市场比较法","D":"残余法"},"answer":"A","explanation":"解题思路：\n- 成本法以重置成本扣除各种贬值确定价值，适用于收益和交易资料不足但成本资料可取得的资产。\n- 题干问的是“教堂、学校、专用机器设备等资产的价值评估，一般适宜选用（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 A。\n选项辨析：\n- A. 成本法：正确。成本法以重置成本扣除各种贬值确定价值，适用于收益和交易资料不足但成本资料可取得的资产。该选项与题干关键词直接对应。\n- B. 收益法：不选。收益法从未来收益折现出发，题干若是重置成本或市场参照就不是它。\n- C. 市场比较法：不选。市场比较法依赖可比交易，题干若强调成本、收益或无法找到可比交易就不选。\n- D. 残余法：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch2-q7","chapter":2,"number":7,"question":"复原重置成本与更新重置成本的相同之处在于运用（）。","options":{"A":"相同的原材料","B":"相同的建造技术标准","C":"资产的现时价格","D":"相同的设计"},"answer":"C","explanation":"解题思路：\n- 复原重置成本按原材料、原设计、原工艺复建同一资产。\n- 题干问的是“复原重置成本与更新重置成本的相同之处在于运用（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 相同的原材料：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 相同的建造技术标准：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 资产的现时价格：正确。复原重置成本按原材料、原设计、原工艺复建同一资产。该选项与题干关键词直接对应。\n- D. 相同的设计：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch2-q8","chapter":2,"number":8,"question":"运用成本法评估一项资产时，若分别选用复原重置成本与更新重置成本，则应当考虑不同重置成本情况下，具有不同的（）。","options":{"A":"实体性贬值","B":"经济性贬值","C":"功能性贬值","D":"资产利用率"},"answer":"C","explanation":"解题思路：\n- 成本法以重置成本扣除各种贬值确定价值，适用于收益和交易资料不足但成本资料可取得的资产。\n- 题干问的是“运用成本法评估一项资产时，若分别选用复原重置成本与更新重置成本，则应当考虑不同重置成本情况下，具有不同的（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 实体性贬值：不选。实体性贬值来自有形损耗，题干若讲技术落后或外部环境就不选。\n- B. 经济性贬值：不选。经济性贬值来自外部因素，题干若讲设备自身磨损或效率不足就不选。\n- C. 功能性贬值：正确。成本法以重置成本扣除各种贬值确定价值，适用于收益和交易资料不足但成本资料可取得的资产。该选项与题干关键词直接对应。\n- D. 资产利用率：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch2-q9","chapter":2,"number":9,"question":"估算资产的实体性贬值时所用的总使用年限是资产的（）。","options":{"A":"总经济使用年限","B":"总技术使用年限","C":"总物理寿命","D":"以上三个都可以"},"answer":"C","explanation":"解题思路：\n- 实体性贬值来自使用、磨损、自然力造成的物理损耗。\n- 题干问的是“估算资产的实体性贬值时所用的总使用年限是资产的（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 总经济使用年限：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 总技术使用年限：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 总物理寿命：正确。实体性贬值来自使用、磨损、自然力造成的物理损耗。该选项与题干关键词直接对应。\n- D. 以上三个都可以：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch2-q10","chapter":2,"number":10,"question":"某机器设备购建于2013年10月、根据其技术经济指标、规定正常使用强度下每天的运转时间为8小时；2013—2017年期间每天实际运转10小时、自2018年初恢复正常使用、现以2019年10月5日为评估基准日、则该设备的实际使用年限为（）年。","options":{"A":"6","B":"7","C":"8","D":"7.5"},"answer":"B","explanation":"解题思路：\n- 2013年10月至2017年底长期超负荷使用，按10小时/8小时折算实际使用年限；2018年初至2019年10月恢复正常使用。折算后约为7年。\n- 因此正确答案是 B。\n选项辨析：\n- A. 6：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 7：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- C. 8：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 7.5：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch2-q11","chapter":2,"number":11,"question":"待评估资产为一栋层高为4米、建筑面积为100平方米的住宅，其复原重置成本为1600元/建筑平方米，而在评估基准日建造具有相同效用的层高为3米的住宅，更新重置成本为1500元/建筑平方米。该住宅的实体性贬值率为20%，则其超额投资功能性贬值为（）元。","options":{"A":"128000","B":"120000","C":"8000","D":"32000"},"answer":"C","explanation":"解题思路：\n- 超额投资功能性贬值=（复原重置成本-更新重置成本）×建筑面积×(1-实体性贬值率)=（1600-1500）×100×(1-20%)=8000元。\n- 因此正确答案是 C。\n选项辨析：\n- A. 128000：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 120000：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 8000：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- D. 32000：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch2-q12","chapter":2,"number":12,"question":"现评估某企业某类通用设备，首先抽样选择具有代表性的通用设备6台，估算其总重置成本为25万元，从会计记录中查得这6台设备的历史总成本为30万元，该类通用设备的账面历史总成本为500万元，则该类通用设备的总重置成本为（）万元。","options":{"A":"357","B":"448","C":"400","D":"417"},"answer":"D","explanation":"解题思路：\n- 抽样设备重置成本/历史成本=25/30；全体通用设备历史成本500万元，所以总重置成本=500×25/30=416.67万元，约417万元。\n- 因此正确答案是 D。\n选项辨析：\n- A. 357：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 448：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 400：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 417：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。"},{"id":"ch2-q13","chapter":2,"number":13,"question":"预计某企业未来5年的税后资产净现金流分别为15万元、13万元、12万元、14万元、15万元，假定该企业资产可以永续经营下去，且从第6年起以后各年收益均为15万元，折现率为10%，确定该企业持续使用假设下的价值为（）万元。","options":{"A":"136","B":"219","C":"127","D":"145"},"answer":"D","explanation":"解题思路：\n- 前5年现金流逐年折现，再加第6年起永续收益在第5年末的资本化价值并折现：15/1.1+13/1.1^2+12/1.1^3+14/1.1^4+15/1.1^5+(15/10%)/1.1^5≈145万元。\n- 因此正确答案是 D。\n选项辨析：\n- A. 136：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 219：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 127：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 145：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。"},{"id":"ch2-q14","chapter":2,"number":14,"question":"某类设备的价值和生产能力之间为非线性关系，市场上年加工1600件产品的该类全新设备价值为10万元，现八成新的年加工900件产品的被评估设备的价值为（）万元。（规模效益指数为0、5。）","options":{"A":"5.6","B":"4.5","C":"7.5","D":"6"},"answer":"D","explanation":"解题思路：\n- 规模经济指数法：全新设备价值=10×(900/1600)^0.5=7.5万元；被评估设备八成新，价值=7.5×80%=6万元。\n- 因此正确答案是 D。\n选项辨析：\n- A. 5.6：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 4.5：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 7.5：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 6：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。"},{"id":"ch2-q15","chapter":2,"number":15,"question":"某评估参照物价格为10万元、成新率为0、5、被评估资产的成新率为0、75、二者在新旧程度方面的差异为（）万元。","options":{"A":"2.5","B":"5","C":"7.5","D":"10"},"answer":"B","explanation":"解题思路：\n- 新旧程度差异调整=参照物价格×(被评估资产成新率/参照物成新率-1)=10×(0.75/0.5-1)=5万元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 2.5：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 5：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- C. 7.5：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 10：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch2-q16","chapter":2,"number":16,"question":"在通常情况下，可以用市场比较法进行评估的资产是（）。","options":{"A":"专利权","B":"专用机器设备","C":"通用设备","D":"专有技术"},"answer":"C","explanation":"解题思路：\n- 市场比较法依赖可比交易，应选择多个可比参照物并进行差异修正。\n- 题干问的是“在通常情况下，可以用市场比较法进行评估的资产是（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 专利权：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 专用机器设备：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 通用设备：正确。市场比较法依赖可比交易，应选择多个可比参照物并进行差异修正。该选项与题干关键词直接对应。\n- D. 专有技术：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch2-q17","chapter":2,"number":17,"question":"在应用市场比较法时，一般应该选择（）参照物进行比较。","options":{"A" 本：正确。复原重置成本按原材料、原设计、原工艺复建同一资产。该选项与题干关键词直接对应。\n- B. 复原重置成本：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 完全重置成本：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 实际重置成本：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch3-q14","chapter":3,"number":14,"question":"某台被评估资产2008年购建，其账面原值为10万元，当时该类设备定基价格指数为120%，2020年对该设备进行评估，当年定基价格指数为180%，则该台设备的重置全价为（）万元。","options":{"A":"10","B":"18","C":"12","D":"15"},"answer":"D","explanation":"解题思路：\n- 定基指数法：重置全价=账面原值×评估日定基指数/购建日定基指数=10×180%/120%=15万元。\n- 因此正确答案是 D。\n选项辨析：\n- A. 10：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 18：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 12：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 15：正确。价格指数法只是把历史成本调整到现时价格水平，通常得到复原重置成本。该选项与题干关键词直接对应。"},{"id":"ch3-q15","chapter":3,"number":15,"question":"某设备的原始价值为5万元，修理后才能正常使用，并且修理后所带来的收益足以弥补修理费用。若修理费用为1万元，重置成本为4万元，则其成新率不会超过（）。","options":{"A":"25%","B":"80%","C":"75%","D":"20%"},"answer":"C","explanation":"解题思路：\n- 设备修好才可用，修理费1万元应从重置成本4万元中扣除可用价值上限：成新率不超过(4-1)/4=75%。\n- 因此正确答案是 C。\n选项辨析：\n- A. 25%：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 80%：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 75%：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- D. 20%：不选。按题干公式或计价口径计算，数值与该项不一致。"}]},{"chapter":4,"title":"第四章 房地产评估","questions":[{"id":"ch4-q1","chapter":4,"number":1,"question":"最佳使用是（）必须考虑的评估前提。","options":{"A":"地产","B":"房屋建筑物","C":"企业资产","D":"资产"},"answer":"A","explanation":"解题思路：\n- 最佳使用原则要求在合法、可能、可行并能带来最高价值的用途下评估。\n- 题干问的是“最佳使用是（）必须考虑的评估前提。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 A。\n选项辨析：\n- A. 地产：正确。最佳使用原则要求在合法、可能、可行并能带来最高价值的用途下评估。该选项与题干关键词直接对应。\n- B. 房屋建筑物：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 企业资产：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 资产：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch4-q2","chapter":4,"number":2,"question":"基准地价系数修正法所要修正的因素是（）。","options":{"A":"地理位置和交通条件","B":"个别因素和市场转让条件","C":"容积率和覆盖率","D":"特别利害关系和特殊动机"},"answer":"B","explanation":"解题思路：\n- 本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。\n- 题干问的是“基准地价系数修正法所要修正的因素是（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 B。\n选项辨析：\n- A. 地理位置和交通条件：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 个别因素 ，该房地产的评估值最接近于（）万元。","options":{"A":"28","B":"32","C":"25","D":"30"},"answer":"A","explanation":"解题思路：\n- 价值=3/1.1+2/1.1^2+1/1.1^3+(3/10%)/1.1^3≈28万元。\n- 因此正确答案是 A。\n选项辨析：\n- A. 28：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- B. 32：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 25：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 30：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch4-q19","chapter":4,"number":19,"question":"被评估土地的剩余使用权年限为30年，参照物剩余使用权年限为25年，假定折现率为8%，被评估土地的年限修正系数最接近于（）。","options":{"A":"0.9659","B":"0.948","C":"1.152","D":"1.054"},"answer":"D","explanation":"解题思路：\n- 年限修正系数=[1-1/(1+8%)^30]/[1-1/(1+8%)^25]≈1.054。\n- 因此正确答案是 D。\n选项辨析：\n- A. 0.9659：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 0.948：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 1.152：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 1.054：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。"},{"id":"ch4-q20","chapter":4,"number":20,"question":"运用最佳使用原则评估地产的前提条件是（）。","options":{"A":"土地的非再生性","B":"土地位置固定性","C":"土地用途广泛性","D":"土地利用永续性"},"answer":"C","explanation":"解题思路：\n- 最佳使用原则之所以适用于地产，是因为土地用途具有广泛性：同一宗土地在合法规划范围内可能用于住宅、商业、工业等不同用途，价值取决于最佳用途。\n- 因此正确答案是 C。\n选项辨析：\n- A. 土地的非再生性：不选。非再生性说明土地稀缺，但不能直接推出要比较不同用途。\n- B. 土地位置固定性：不选。位置固定影响区位价值，不是最佳使用原则的前提。\n- C. 土地用途广泛性：正确。只有用途可选择，才有“最佳使用”的比较空间。\n- D. 土地利用永续性：不选。永续性影响收益年限，不是最佳使用原则的核心前提。"},{"id":"ch4-q21","chapter":4,"number":21,"question":"某宗地取得费用为每平方米100元，开发费用为每平方米300元，当地银行一年期贷款利率为9%，二年期贷款利率为10%，三年期贷款利率为11%，开发周期为3年，第一年投资占总投资的1/2，第二、三年投资各占总投资的1/4，该土地每平方米应负担利息为（）元。","options":{"A":"51.75","B":"3","C":"89","D":"71.25"},"answer":"C","explanation":"解题思路：\n- 利息按各年投入占用期计算：取得费100元占3年，开发费300元中第一年150元占约2.5年、第二三年各75元分别占约1.5年和0.5年，按相应贷款利率估算，合计约89元。\n- 因此正确答案是 C。\n选项辨析：\n- A. 51.75：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 3：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 89：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- D. 71.25：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch4-q22","chapter":4,"number":22,"question":"某砖混结构单层住宅宅基地为200平方米，建筑面积为120平方米，月租金为3000元，土地资本化率为8%，取得租金收入的年总成本为8000元，评估人员另用市场比较法求得土地使用权价格为1200元/平方米，建筑物的年纯收益为（）元。","options":{"A":"8600","B":"8800","C":"9000","D":"12000"},"answer":"B","explanation":"解题思路：\n- 年净租金=3000×12-8000=28000元；土地价值=200×1200=240000元，土地收益=240000×8%=19200元；建筑物年纯收益=28000-19200=8800元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 8600：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 8800：正确。市场比较法依赖可比交易，应选择多个可比参照物并进行差异修正。该选项与题干关键词直接对应。\n- C. 9000：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 12000：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch4-q23","chapter":4,"number":23,"question":"某宗2000平方米空地的预计最佳利用方式为开发一建筑面积4000平方米的商业建筑。预期该商业房地产建成后的售价为3000元/平方米，估计该建筑物的建筑费用为1400元/平方米，专业费用为建筑费用的6%，利息和利润为地价、建筑费用及专业费用之和的15%，销售费用及有关税费为售价的10%，该土地的价值接近于（）元/平方米。","options":{"A":"1728","B":"1900","C":"1500","D":"1000"},"answer":"A","explanation":"解题思路：\n- 总开发价值=3000×4000=1200万元；建筑费=1400×4000=560万元；专业费=560×6%=33.6万元；销售税费=1200×10%=120万元。设土地总价为L，L=1200-560-33.6-120-15%×(L+560+33.6)，解得L≈345.6万元，单位地价=345.6万/2000≈1728元/平方米。\n- 因此正确答案是 A。\n选项辨析：\n- A. 1728：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- B. 1900：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 1500：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 1000：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch4-q24","chapter":4,"number":24,"question":"在用收益法评估土地使用权价格时，总费用不包括（）。","options":{"A":"房地产税金","B":"管理费","C":"利息","D":"保险费"},"answer":"C","explanation":"解题思路：\n- 本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。\n- 题干问的是“在用收益法评估土地使用权价格时，总费用不包括（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 房地产税金：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 管理费：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 利息：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- D. 保险费：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch4-q25","chapter":4,"number":25,"question":"某宗土地用于住宅开发时的价值为300万元，用于商业大楼开发时的价值为500万元，用于工业厂房开发时的价值为280万元。城市规划确认该土地可用于住宅或工业。该宗土地的价值应评估为300万元。这体现了房地产评估的（）。","options":{"A":"供求原则","B":"替代原则","C":"最佳使用原则","D":"贡献原则"},"answer":"C","explanation":"解题思路：\n- 替代原则强调理性购买者不会支付超过同等效用替代资产成本的价格。\n- 题干问的是“某宗土地用于住宅开发时的价值为300万元，用于商业大楼开发时的价值为500万元，用于工业厂房开发时的价值为280万元。城市规划确认该土地可用于住宅或工业。该宗土地的价值应评估为300万元。这体 题干公式或计价口径计算，数值与该项不一致。\n- D. 12000：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch5-q3","chapter":5,"number":3,"question":"下列公式能够成立的是（）。","options":{"A":"销售收入分成率=销售利润分成率×销售利润率","B":"销售利润分成率=销售收入分成率/销售利润率","C":"销售利润分成率=销售收入分成率×销售利润率","D":"销售收入分成率=1-销售利润分成率"},"answer":"B","explanation":"解题思路：\n- 本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。\n- 题干问的是“下列公式能够成立的是（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 B。\n选项辨析：\n- A. 销售收入分成率=销售利润分成率×销售利润率：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 销售利润分成率=销售收入分成率/销售利润率：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- C. 销售利润分成率=销售收入分成率×销售利润率：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 销售收入分成率=1-销售利润分成率：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch5-q4","chapter":5,"number":4,"question":"某企业的预期年收益额为16万元，该企业各单项资产之和为60万元，企业所在行业的平均收益率为20%，以此为适用本金化率计算出的商誉价值为（）万元。","options":{"A":"10","B":"20","C":"30","D":"40"},"answer":"B","explanation":"解题思路：\n- 正常收益=60×20%=12万元；超额收益=16-12=4万元；商誉=4/20%=20万元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 10：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 20：正确。商誉是企业整体收益超过可辨认单项资产正常收益的资本化价值。该选项与题干关键词直接对应。\n- C. 30：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 40：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch5-q5","chapter":5,"number":5,"question":"某企业5年前获得一项专利，法定寿命为10年，现对其进行价值评估。经过专家估算，截止到评估基准日，其重置成本为120万元，尚可使用3年，则该项专利的评估价值为（）万元。","options":{"A":"45","B":"50","C":"60","D":"72"},"answer":"A","explanation":"解题思路：\n- 成本法下按剩余使用年限分摊：评估值=重置成本120×尚可使用年限3/(已使用5+尚可使用3)=45万元。\n- 因此正确答案是 A。\n选项辨析：\n- A. 45：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- B. 50：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 60：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 72：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch5-q6","chapter":5,"number":6,"question":"用成本法评估某项专利技术，已知在开发该专利的过程中耗费材料费用20万元，工资费用30万元，管理费用5万元，专用设备费10万元，营销费用5万元，咨询鉴定费5万元，其直接成本为（）万元。","options":{"A":"60","B":"50","C":"65","D":"20"},"answer":"C","explanation":"解题思路：\n- 直接成本包括材料20、工资30、管理5、专用设备10，不包括营销费用和咨询鉴定费；合计65万元。\n- 因此正确答案是 C。\n选项辨析：\n- A. 60：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 50：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 65：正确。成本法以重置成本扣除各种贬值确定价值，适用于收益和交易资料不足但成本资料可取得的资产。该选项与题干关键词直接对应。\n- D. 20：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch5-q7","chapter":5,"number":7,"question":"下列阐述中正确的是（）。","options":{"A":"商誉是能够离开企业而单独存在的","B":"商标可以转让其使用权，但不能够转让其所有权","C":"商标可以转让其所有权，也可以转让其使用权","D":"商誉是产品的标志"},"answer":"C","explanation":"解题思路：\n- 本题辨析商誉与商标。商誉不能离开企业单独存在；商标是产品或服务的标志，其所有权和使用权都可以依法转让。\n- 因此正确答案是 C。\n选项辨析：\n- A. 商誉是能够离开企业而单独存在的：不选。商誉依附于企业整体获利能力，不能脱离企业单独转让。\n- B. 商标可以转让其使用权.但不能够转让其所有权：不选。商标所有权也可以依法转让。\n- C. 商标可以转让其所有权.也可以转让其使用权：正确。商标权既可转让所有权，也可通过许可转让使用权。\n- D. 商誉是产品的标志：不选。产品标志对应商标，不是商誉。"},{"id":"ch5-q8","chapter":5,"number":8,"question":"对无形资产进行转让、投资评估的前提条件是无形资产（）。","options":{"A":"可以确指","B":"附着于有形资产","C":"技术成熟度高","D":"可带来超额利润"},"answer":"D","explanation":"解题思路：\n- 无形资产价值通常取决于可确指性、超额收益能力和剩余经济寿命。\n- 题干问的是“对无形资产进行转让、投资评估的前提条件是无形资产（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 可以确指：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 附着于有形资产：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 技术成熟度高：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 可带来超额利润：正确。无形资产价值通常取决于可确指性、超额收益能力和剩余经济寿命。该选项与题干关键词直接对应。"},{"id":"ch5-q9","chapter":5,"number":9,"question":"预期某企业未来5年的净收益分别为13万元、14万元、11万元、12万元、15万元，第6年起的净收益保持在15万元左右。采用对各单项资产价值进行评估加总的方式确定企业价值为90万元。折现率为10%。该企业的商誉价值为（）万元。","options":{"A":"100","B":"142","C":"52","D":"130"},"answer":"C","explanation":"解题思路：\n- 企业整体收益价值=前5年收益折现+第6年起永续收益折现≈142万元；商誉=整体价值142-单项资产加总90=52万元。\n- 因此正确答案是 C。\n选项辨析：\n- A. 100：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 142：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 52：正确。商誉是企业整体收益超过可辨认单项资产正常收益的资本化价值。该选项与题干关键词直接对应。\n- D. 130：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch5-q10","chapter":5,"number":10,"question":"某企业一项专利技术的法律保护期自2008年1月起20年，2014年1月预计其可带来超额利润的年限尚有10年。现在该企业拟将该技术转让给另一家企业使用5年，并从其年预期销售收入8000万元中分成15%作为转让收益。所得税税率为25%。折现率为10%。该技术的转让价值为（）万元。","options":{"A":"3412","B":"4940","C":"5923","D":"6845"},"answer":"A","explanation":"解题思路：\n- 转让收益年额=8000×15%=1200万元；税后=1200×(1-25%)=900万元；5年年金现值=900×(P/A,10%,5)=900×3.7908≈3412万元。\n- 因此正确答案是 A。\n选项辨析：\n- A. 3412：正确。专利价值受法律保护期、剩余收益期、超额收益和折现率影响。该选项与题干关键词直接对应。\n- B. 4940：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 5923：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 6845：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch5-q11","chapter":5,"number":11,"question":"对于同一专利权来讲、其价值最高许可使用形式为（）。","options":{"A":"普通使用许可","B":"排他使用许可","C":"交互使用许可","D":"独占使用许可"},"answer":"D","explanation":"解题思路：\n- 专利价值受法律保护期、剩余收益期、超额收益和折现率影响。\n- 题干问的是“对于同一专利权来讲、其价值最高许可使用形式为（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 普通使用许可：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 排他使用许可：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 交互使用许可：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 独占使用许可：正确。专利价值受法律保护期、剩余收益期、超额收益和折现率影响。该选项与题干关键词直接对应。"}]},{"chapter":6,"title":"第六章 金融资产评估","questions":[{"id":"ch6-q1","chapter":6,"number":1,"question":"被评估债券为年一次性还本付息债券100000元，年利率为18%，不计复利，评估时债券的购入时间已经满2年，当年的国库券利率为10%，该企业的风险报酬率为2%，被评估债券的价值为（）元。","options":{"A":"137 117","B":"172 000","C":"118 000","D":"153 380"},"answer":"A","explanation":"解题思路：\n- 到期本利和=100000×(1+4×18%)=172000元；折现率=国库券利率10%+风险报酬率2%=12%；距到期2年，价值=172000/(1+12%)^2≈137117元。\n- 因此正确答案是 A。\n选项辨析：\n- A. 137 117：正确。债券评估的核心是把未来本息按适当折现率折现。该选项与题干关键词直接对应。\n- B. 172 000：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 118 000：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 153 380：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch6-q2","chapter":6,"number":2,"question":"被评估企业拥有甲企业发行的5年期债券100张，每张面值1万元，债券利息率每年为9%，复利计息，到期一次还本付息。评估基准日至债券到期还有两年，若适用的折现率为15%，则被评估企业拥有甲企业债券的评估值最接近于（）万元。","options":{"A":"109","B":"116","C":"122","D":"154"},"answer":"B","explanation":"解题思路：\n- 到期本利和=100×1×(1+9%)^5=153.86万元；距到期2年，评估值=153.86/(1+15%)^2≈116万元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 109：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 116：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- C. 122：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 154：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch6-q3","chapter":6,"number":3,"question":"某被评估企业拥有A公司面值共90万元的非上市普通股票，从持股期间来看，每年股利分派相当于票面值的10%，评估人员通过调查，了解到A公司每年将把税后利润的80%用于股利分配，20%用于公司扩大再生产，公司有很强的发展后劲，公司股本利润率保持在15%的水平上，折现率设定为12%，如运用红利增长模型评估被评估企业拥有的A公司股票，其评估值最有可能是（）万元。","options":{"A":"90","B":"103","C":"100","D":"60"},"answer":"B","explanation":"解题思路：\n- 股利D1=90×10%×(1+3%)=9.27万元；增长率g=留存收益率20%×股本利润率15%=3%；股票价值=D1/(12%-3%)=103万元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 90：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 103：正确。股票评估通常基于未来股利、红利增长或清算价值等口径。该选项与题干关键词直接对应。\n- C. 100：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 60：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch6-q4","chapter":6,"number":4,"question":"上市公司股票的清算价格是（）。","options":{"A":"资产总额与总股数的比值","B":"资产总额与流通股数的比值","C":"净资产与上市流通总股数的比值","D":"净资产与总股数的比值"},"answer":"D","explanation":"解题思路：\n- 股票清算价格反映公司清算时普通股股东可分配的净资产份额。核心口径是“净资产/总股数”。\n- 因此正确答案是 D。\n选项辨析：\n- A. 资产总额与总股数的比值：不选。资产总额没有扣除负债，不能代表股东清算可得价值。\n- B. 资产总额与流通股数的比值：不选。既没有扣除负债，又只用流通股数，口径错误。\n- C. 净资产与上市流通总股数的比值：不选。净资产属于全部股东，应除以总股数，不是只除以流通股。\n- D. 净资产与总股数的比值：正确。清算价格应按全部净资产在全部股份之间分摊。"}]},{"chapter":7,"title":"第七章 流动资产和其他资产评估","questions":[{"id":"ch7-q1","chapter":7,"number":1,"question":"评估流动资产时有时会考虑其（）。","options":{"A":"经济性贬值","B":"功能性贬值","C":"实体性损耗","D":"各种贬值"},"answer":"C","explanation":"解题思路：\n- 功能性贬值来自技术落后、运营成本过高或设计不经济。\n- 题干问的是“评估流动资产时有时会考虑其（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 经济性贬值：不选。经济性贬值来自外部因素，题干若讲设备自身磨损或效率不足就不选。\n- B. 功能性贬值：不选。功能性贬值来自技术或效率差异，题干若讲物理磨损或外部市场影响就不选。\n- C. 实体性损耗：正确。功能性贬值来自技术落后、运营成本过高或设计不经济。该选项与题干关键词直接对应。\n- D. 各种贬值：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch7-q2","chapter":7,"number":2,"question":"在用低值易耗品的评估一般采用（）。","options":{"A":"成本法","B":"市场比较法","C":"收益法","D":"清算价格法"},"answer":"A","explanation":"解题思路：\n- 清算假设适用于被迫出售、偿债处置、停用报废等非正常持续使用情形。\n- 题干问的是“在用低值易耗品的评估一般采用（）。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 A。\n选项辨析：\n- A. 成本法：正确。清算假设适用于被迫出售、偿债处置、停用报废等非正常持续使用情形。该选项与题干关键词直接对应。\n- B. 市场比较法：不选。市场比较法依赖可比交易，题干若强调成本、收益或无法找到可比交易就不选。\n- C. 收益法：不选。收益法从未来收益折现出发，题干若是重置成本或市场参照就不是它。\n- D. 清算价格法：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch7-q3","chapter":7,"number":3,"question":"企业的A材料为一个月前从外地购进，数量为5000千克，单价为200元，当时付运杂费500元。评估时清查盘点尚有1500千克A材料，则该材料评估值为（）元。","options":{"A":"30000","B":"300150","C":"300500","D":"以上都不对"},"answer":"B","explanation":"解题思路：\n- 材料单价200元/千克，剩余1500千克，评估值=1500×200+按比例分摊的运杂费500×1500/5000=300150元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 30000：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 300150：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- C. 300500：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 以上都不对：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch7-q4","chapter":7,"number":4,"question":"某低值易耗品原价700元，预计可使用1年，现已使用6个月。据调查，该低值易耗品的现行市价为1100元，则其评估值为（）元。","options":{"A":"1100","B":"1000","C":"800","D":"550"},"answer":"D","explanation":"解题思路：\n- 低值易耗品按现行市价并结合成新率：已使用6个月、预计使用12个月，成新率50%；评估值=1100×50%=550元。\n- 因此正确答案是 D。\n选项辨析：\n- A. 1100：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 1000：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 800：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 550：正确。在用低值易耗品通常用成本法，按现行成本结合实际损耗程度确定价值。该选项与题干关键词直接对应。"},{"id":"ch7-q5","chapter":7,"number":5,"question":"采用成本法对在用低值易耗品进行评估时，成新率的确定应根据（）。","options":{"A":"已使用月数","B":"已摊销数额","C":"实际损耗程度","D":"尚未摊销数额"},"answer":"C","explanation":"解题思路：\n- 成本法以重置成本扣除各种贬值确定价值，适用于收益和交易资料不足但成本资料可取得的资产。\n- 题干问的是“采用成本法对在用低值易耗品进行评估时，成新率的确定应根据（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 已使用月数：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 已摊销数额：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 实际损耗程度：正确。成本法以重置成本扣除各种贬值确定价值，适用于收益和交易资料不足但成本资料可取得的资产。该选项与题干关键词直接对应。\n- D. 尚未摊销数额：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch7-q6","chapter":7,"number":6,"question":"某企业截止到评估基准日，经核实的应收账款余额为200万元，前5年有关资料如下：第1年应收账款余额30万元、坏账金额0.25万元；第2年35万元、0.5万元；第3年60万元、0.8万元；第4年90万元、8万元；第5年105万元、20万元。根据上述资料，该企业应收账款的评估值应为（）万元。","options":{"A":"200","B":"190.45","C":"181.6","D":"175.5"},"answer":"C","explanation":"解题思路：\n- 前5年坏账率=(0.25+0.5+0.8+8+20)/(30+35+60+90+105)=29.55/320≈9.23%；预计坏账=200×9.23%=18.46万元；评估值=200-18.46≈181.6万元。\n- 因此正确答案是 C。\n选项辨析：\n- A. 200：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 190.45：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 181.6：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- D. 175.5：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch7-q7","chapter":7,"number":7,"question":"确定应收账款评估值的基本公式是：应收账款评估值等于（）。","options":{"A":"应收账款账面值一已确定坏账损失一预计坏账损失","B":"应收账款账面值一坏账准备一预计坏账损失","C":"应收账款账面值一已确定坏账损失一坏账损失","D":"应收账款账面值一坏账准备一坏账损失"},"answer":"A","explanation":"解题思路：\n- 应收账款评估应从账面余额中扣除已确定和预计坏账损失。\n- 题干问的是“确定应收账款评估值的基本公式是：应收账款评估值等于（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 A。\n选项辨析：\n- A. 应收账款账面值一已确定坏账损失一预计坏账损失：正确。应收账款评估应从账面余额中扣除已确定和预计坏账损失。该选项与题干关键词直接对应。\n- B. 应收账款账面值一坏账准备一预计坏账损失：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 应收账款账面值一已确定坏账损失一坏账损失：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 应收账款账面值一坏账准备一坏账损失：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch7-q8","chapter":7,"number":8,"question":"一般来说，应收账款评估后，账面上的“坏账准备”科目应为（）。","options":{"A":"零","B":"应收账款的3%.5%","C":"按账龄分析确定","D":"评估确定的坏账数字"},"answer":"A","explanation":"解题思路：\n- 应收账款评估应从账面余额中扣除已确定和预计坏账损失。\n- 题干问的是“一般来说，应收账款评估后，账面上的“坏账准备”科目应为（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 A。\n选项辨析：\n- A. 零：正确。应收账款评估应从账面余额中扣除已确定和预计坏账损失。该选项与题干关键词直接对应。\n- B. 应收账款的3%.5%：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 按账龄分析确定：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 评估确定的坏账数字：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch7-q9","chapter":7,"number":9,"question":"某企业向甲企业售出一批半成品，货款金额500万元，约定半年后付款。采用商业承兑汇票结算。该企业6月10日开出汇票，并经甲企业承兑。汇票到期日为12月10日。现对该企业进行评估。评估基准日为8月10日，月折现率为5‰，则应收票据的评估值应为（）万元。","options":{"A":"500","B":"490","C":"510","D":"495"},"answer":"B","explanation":"解题思路：\n- 到期值500万元，评估日至到期还有4个月，按月折现率5‰贴现：500/(1+0.005×4)≈490.2万元，最接近490万元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 500：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 490：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- C. 510：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 495：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch7-q10","chapter":7,"number":10,"question":"某企业3月初预付6个月的房屋租金90万元，当年5月1日对该企业评估时，该预付费用评估值为（）万元。","options":{"A":"35","B":"60","C":"45","D":"30"},"answer":"B","explanation":"解题思路：\n- 预付6个月租金90万元，每月15万元。3月初至5月1日已受益2个月，剩余4个月，评估值=15×4=60万元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 35：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 60：正确。预付费用只评估评估基准日以后尚能带来效益的部分。该选项与题干关键词直接对应。\n- C. 45：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 30：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch7-q11","chapter":7,"number":11,"question":"对上市有价证券评估时，一般可按评估基准日的相关有价证券的（）计算评估值。","options":{"A":"最高价","B":"最低价","C":"中间价","D":"收盘价"},"answer":"D","explanation":"解题思路：\n- 评估基准日是资产价值成立和资产状态被锁定的具体时点。\n- 题干问的是“对上市有价证券评估时，一般可按评估基准日的相关有价证券的（）计算评估值。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 最高价：不选。最高价不是通常采用的基准日客观计价口径。\n- B. 最低价：不选。最低价不是通常采用的基准日客观计价口径。\n- C. 中间价：不选。中间价不如基准日收盘价能直接反映上市证券时点价值。\n- D. 收盘价：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。"},{"id":"ch7-q12","chapter":7,"number":12,"question":"对外币存款折算为人民币时，一般应按（）折算。","options":{"A":"月平均外汇牌价","B":"年平均外汇牌价","C":"评估基准日外汇牌价","D":"当年最低外汇牌价"},"answer":"C","explanation":"解题思路：\n- 评估基准日是资产价值成立和资产状态被锁定的具体时点。\n- 题干问的是“对外币存款折算为人民币时，一般应按（）折算。”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 C。\n选项辨析：\n- A. 月平均外汇牌价：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 年平均外汇牌价：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 评估基准日外汇牌价：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- D. 当年最低外汇牌价：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch7-q13","chapter":7,"number":13,"question":"某企业当年1月31日预付未来一年的保险金12万元，至评估基准日2020年4月30日已摊销3万元。该预付费用评估值为（）万元。","options":{"A":"9","B":"8","C":"12","D":"10"},"answer":"A","explanation":"解题思路：\n- 预付保险金12万元，已摊销3万元，尚未受益部分=12-3=9万元。\n- 因此正确答案是 A。\n选项辨析：\n- A. 9：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- B. 8：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 12：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 10：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch7-q14","chapter":7,"number":14,"question":"某企业有一张为期一年的票据，票面值为65万元，年利率为7.2%，截止到评估基准日，离付款期尚差两个半月的时间，该应收票据的评估价值为（）元。","options":{"A":"659 750","B":"687 050","C":"640250","D":"678 050"},"answer":"B","explanation":"解题思路：\n- 到期值=650000×(1+7.2%)=696800元；距到期2.5个月，相当于尚未实现利息=650000×7.2%×2.5/12=9750元；评估值=696800-9750=687050元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 659 750：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 687 050：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- C. 640250：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 678 050：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch7-q15","chapter":7,"number":15,"question":"某企业有一期限为10个月的应收票据，本金为500000元，月利率为1%，截止到评估基准日，离付款期尚差三个半月的时间，则该应收票据的评估值为（）元。","options":{"A":"532500","B":"500000","C":"517500","D":"523500"},"answer":"A","explanation":"解题思路：\n- 票据已持有10-3.5=6.5个月，评估值=本金500000×(1+1%×6.5)=532500元。\n- 因此正确答案是 A。\n选项辨析：\n- A. 532500：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- B. 500000：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 517500：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 523500：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch7-q16","chapter":7,"number":16,"question":"某企业于2018年10月购进1000吨钢材，每吨价格为3800元，2019年9月购进钢材500吨，每吨价格为4000元，2019年10月有库存钢材700吨，该批库存钢材2019年10月的评估价值为（）万元。","options":{"A":"280","B":"266","C":"273","D":"276"},"answer":"A","explanation":"解题思路：\n- 库存700吨来自最近购进的500吨和上一批剩余200吨；评估时按现行价4000元/吨计价，700×4000=280万元。\n- 因此正确答案是 A。\n选项辨析：\n- A. 280：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- B. 266：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 273：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 276：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch7-q17","chapter":7,"number":17,"question":"某企业产成品实有数量80台，每台实际成本为940元，该产品的材料费用与工资费用的比例为70:30，根据有关资料，材料费用综合调整系数为1.2，工资费用调整系数为1.08。该产品的评估值为（）元。","options":{"A":"97450","B":"87530","C":"75200","D":"88000"},"answer":"B","explanation":"解题思路：\n- 单位评估成本=940×70%×1.2+940×30%×1.08=1094.16元；80台合计=87532.8元，最接近87530元。\n- 因此正确答案是 B。\n选项辨析：\n- A. 97450：不选。按题干公式或计价口径计算，数值与该项不一致。\n- B. 87530：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- C. 75200：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 88000：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch7-q18","chapter":7,"number":18,"question":"流动资产评估无须考虑功能性贬值是因为（）。","options":{"A":"周转速度快","B":"流动性强","C":"形态多样化","D":"库存数量少"},"answer":"A","explanation":"解题思路：\n- 功能性贬值通常要经过较长使用期才会因技术落后、效率下降而体现。流动资产周转速度快，持有周期短，所以通常无须考虑功能性贬值。\n- 因此正确答案是 A。\n选项辨析：\n- A. 周转速度快：正确。周转快意味着资产停留时间短，功能落后问题一般来不及形成评估上的功能性贬值。\n- B. 流动性强：不选。流动性强说明容易变现，但不是无须考虑功能性贬值的直接原因。\n- C. 形态多样化：不选。形态多样只是分类特征，不能解释功能性贬值。\n- D. 库存数量少：不选。库存多少与是否发生功能性贬值没有必然关系。"},{"id":"ch7-q19","chapter":7,"number":19,"question":"某公司在2018年1月租赁一临街房屋，租期为4年，租金为4万元（假定这里不考虑货币时间价值）。2020年1月该公司又向保险公司交付火灾保险费240元。2020年6月30日，该公司账簿上的房租已摊销3万元。该公司经房主同意，愿意在2020年7月转租房屋，若市场租金自2018年以来没有发生变动，其转租的客观租金应为（）元。","options":{"A":"15120","B":"12150","C":"20120","D":"20220"},"answer":"A","explanation":"解题思路：\n- 4年租金共40000元，每半年应摊5000元。2020年7月至2021年12月剩余18个月，对应租金15000元；保险费240元覆盖2020全年，7月至12月剩余120元；客观租金=15000+120=15120元。\n- 因此正确答案是 A。\n选项辨析：\n- A. 15120：正确。本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。该选项与题干关键词直接对应。\n- B. 12150：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 20120：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 20220：不选。按题干公式或计价口径计算，数值与该项不一致。"},{"id":"ch7-q20","chapter":7,"number":20,"question":"被评估企业已经正常营业3年，长期待摊费用账面余额为120万元，其中包括固定资产大修理费85万元，办公室装修费15万元，产品销售部房租20万元。经查，其中20万元的房租费为租期5年的租金总额，至评估基准日已经租用1年，企业尚未摊销，而大修理费和装修费均为按10年摊销的余额，则该长期待摊费用的评估值为（）万元。","options":{"A":"16","B":"20","C":"35","D":"116"},"answer":"A","explanation":"解题思路：\n- 大修理费和装修费属于已发生并已在经营中发挥效益的费用余额，通常不再评估；房租20万元租期5年，已用1年，剩余4年价值=20×4/5=16万元。\n- 因此正确答案是 A。\n选项辨析：\n- A. 16：正确。评估基准日是资产价值成立和资产状态被锁定的具体时点。该选项与题干关键词直接对应。\n- B. 20：不选。按题干公式或计价口径计算，数值与该项不一致。\n- C. 35：不选。按题干公式或计价口径计算，数值与该项不一致。\n- D. 116：不选。按题干公式或计价口径计算，数值与该项不一致。"}]},{"chapter":8,"title":"第八章 企业价值评估","questions":[{"id":"ch8-q1","chapter":8,"number":1,"question":"企业价值评估的一般前提是企业的（）。","options":{"A":"独立性","B":"持续经营性","C":"整体性","D":"营利性"},"answer":"B","explanation":"解题思路：\n- 持续经营假设适用于企业作为经营整体继续存在、继续获利的情形。\n- 题干问的是“企业价值评估的一般前提是企业的（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 B。\n选项辨析：\n- A. 独立性：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 持续经营性：正确。持续经营假设适用于企业作为经营整体继续存在、继续获利的情形。该选项与题干关键词直接对应。\n- C. 整体性：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 营利性：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。"},{"id":"ch8-q2","chapter":8,"number":2,"question":"企业价值大小的决定因素是（）。","options":{"A":"独立性","B":"持续经营性","C":"社会性","D":"营利性"},"answer":"D","explanation":"解题思路：\n- 持续经营假设适用于企业作为经营整体继续存在、继续获利的情形。\n- 题干问的是“企业价值大小的决定因素是（”，应抓住限定条件而不是只看某个相近词。\n- 因此正确答案是 D。\n选项辨析：\n- A. 独立性：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- B. 持续经营性：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- C. 社会性：不选。该项只涉及相邻概念或局部因素，不能完整回答题干限定条件。\n- D. 营利性：正确。持续经营假设适用于企业作为经营整体继续存在、继续获利的情形。该选项与题干关键词直接对应。"},{"id":"ch8-q3","chapter":8,"number":3,"question":"评估人员选择适当的折现率将企业的息前净现金流量进行了资本还原，得到了初步评估结果。本次评估要求的是企业的净资产价值即权益价值。对初步评估结果应做的进一步调整是（）。","options":{"A":"减企业的全部负债","B":"加企业的全部负债","C":"减企业的长期负债","D":"减企业的流动负债"},"answer":"A","explanation":"解题思路：\n- 本题考查资产评估中的概念辨析。先抓题干限定条件，再判断它对应的是价值类型、评估假设、评估方法还是具体计算口径。\n- 题干问的是“评估人员选择适当的折现率将企业的息前 const STORE_KEY='asset_eval_quiz_v1'; const EXAM_SIZE=20; const WRONG_STREAK_TARGET=5; const letters=['A','B','C','D']; let state=loadState(); let view={mode:'chapter',chapter:1,index:0,order:[],examIds:[],optionOrders:{}}; let answeredCorrect=false;
function allQuestions(){return DATA.flatMap(ch=>ch.questions||[])} function getQuestion(id){return allQuestions().find(q=>q.id===id)} function chapterByNo(no){return DATA.find(ch=>ch.chapter===no)}
function normalizeState(raw){const next=raw&&typeof raw==='object'?raw:{};return{stats:next.stats&&typeof next.stats==='object'?next.stats:{},wrongbook:Array.isArray(next.wrongbook)?next.wrongbook:[],starred:Array.isArray(next.starred)?next.starred:[]}}
function loadState(){try{return normalizeState(JSON.parse(localStorage.getItem(STORE_KEY)))}catch{return normalizeState({})}} function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function statFor(id){if(!state.stats[id])state.stats[id]={attempts:0,wrongs:0,corrects:0,wrongStreak:0};if(typeof state.stats[id].wrongStreak!=='number')state.stats[id].wrongStreak=0;return state.stats[id]}
function errorRate(id){const s=statFor(id);return s.attempts?Math.round(s.wrongs/s.attempts*100):0} function wrongStreak(id){return statFor(id).wrongStreak||0}
function setWrong(id){if(!state.wrongbook.includes(id))state.wrongbook.push(id);statFor(id).wrongStreak=0}
function removeWrong(id){state.wrongbook=state.wrongbook.filter(x=>x!==id)}
function updateWrongbookStreak(id,ok){const s=statFor(id);if(!ok){setWrong(id);return false}if(!state.wrongbook.includes(id))return false;s.wrongStreak+=1;if(s.wrongStreak>=WRONG_STREAK_TARGET){removeWrong(id);return true}return false}
function isStarred(id){return state.starred.includes(id)} function updateStarButton(id){const starred=isStarred(id);const btn=document.getElementById('starBtn');if(btn){btn.className=`btn ${starred?'starred':''}`;btn.textContent=starred?'★ '+UI.unmarkStar:'☆ '+UI.markStar}const mark=document.getElementById('currentStarMark');if(mark)mark.innerHTML=starred?'<span class="star-mark">★</span>':''}
function toggleStar(id){if(!id)return;const wasStarred=isStarred(id);state.starred=wasStarred?state.starred.filter(x=>x!==id):state.starred.concat(id);saveState();updateStarButton(id);renderNav();renderStats();if(view.mode==='starred'&&wasStarred&&view.order[view.index]===id&&!answeredCorrect){render();return}if(!answeredCorrect)renderQuestionList()}
function sample(arr,n){const copy=arr.slice();for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy.slice(0,Math.min(n,copy.length))}
function optionOrderFor(id){if(!view.optionOrders)view.optionOrders={};if(!view.optionOrders[id])view.optionOrders[id]=letters.slice();return view.optionOrders[id]}
function displayLetterForKey(id,key){const order=optionOrderFor(id);const idx=order.indexOf(key);return idx>=0?letters[idx]:key}
function shuffleOptions(){ensureOrder();view.optionOrders={};view.order.forEach(id=>{view.optionOrders[id]=sample(letters,letters.length)});answeredCorrect=false;render()}
function makeExamIds(){const base=Math.floor(EXAM_SIZE/DATA.length);let extra=EXAM_SIZE-base*DATA.length;const extraChapters=sample(DATA.map(ch=>ch.chapter),extra);let ids=[];DATA.forEach(ch=>{const n=base+(extraChapters.includes(ch.chapter)?1:0);ids=ids.concat(sample(ch.questions||[],n).map(q=>q.id))});return sample(ids,ids.length)}
function currentQuestions(){if(view.mode==='wrong')return state.wrongbook.map(getQuestion).filter(Boolean);if(view.mode==='starred')return state.starred.map(getQuestion).filter(Boolean);if(view.mode==='exam')return (view.examIds||[]).map(getQuestion).filter(Boolean);const ch=chapterByNo(view.chapter);return ch?ch.questions:[]}
function ensureOrder(){const ids=currentQuestions().map(q=>q.id);if(!view.order.length||view.order.some(id=>!ids.includes(id))||ids.some(id=>!view.order.includes(id)))view.order=ids.slice();if(view.index>=view.order.length)view.index=Math.max(0,view.order.length-1)}
function shuffle(){if(view.mode==='exam'){selectExam();return}ensureOrder();for(let i=view.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[view.order[i],view.order[j]]=[view.order[j],view.order[i]]}view.index=0;answeredCorrect=false;render()} function selectChapter(no){view={mode:'chapter',chapter:no,index:0,order:[],examIds:[],optionOrders:{}};answeredCorrect=false;render()} function selectWrongbook(){view={mode:'wrong',chapter:null,index:0,order:[],examIds:[],optionOrders:{}};answeredCorrect=false;render()} function selectStarred(){view={mode:'starred',chapter:null,index:0,order:[],examIds:[],optionOrders:{}};answeredCorrect=false;render()} function selectExam(){const ids=makeExamIds();view={mode:'exam',chapter:null,index:0,order:ids.slice(),examIds:ids,optionOrders:{}};answeredCorrect=false;render()} function goToIndex(i){view.index=i;answeredCorrect=false;render()} function nextQuestion(){if(!answeredCorrect)return;const currentId=view.order[view.index];const oldIndex=view.index;const oldOrder=view.order.slice();ensureOrder();if(!view.order.length){answeredCorrect=false;render();return}let nextIndex;if(view.order.includes(currentId)){nextIndex=Math.min(view.order.indexOf(currentId)+1,view.order.length-1)}else{const nextOldId=oldOrder.slice(oldIndex+1).find(id=>view.order.includes(id));nextIndex=nextOldId?view.order.indexOf(nextOldId):Math.min(oldIndex,view.order.length-1)}view.index=nextIndex;answeredCorrect=false;render()} function prevQuestion(){view.index=Math.max(view.index-1,0);answeredCorrect=false;render()}
function answer(selectedKey){if(answeredCorrect)return;const q=getQuestion(view.order[view.index]);if(!q)return;const s=statFor(q.id);s.attempts+=1;const optionNodes=document.querySelectorAll('.option');optionNodes.forEach(n=>n.classList.remove('wrong'));if(selectedKey===q.answer){s.corrects+=1;answeredCorrect=true;const removed=updateWrongbookStreak(q.id,true);optionNodes.forEach(n=>{if(n.dataset.key===selectedKey)n.classList.add('correct')});showFeedback(true,q,removed)}else{s.wrongs+=1;updateWrongbookStreak(q.id,false);optionNodes.forEach(n=>{if(n.dataset.key===selectedKey)n.classList.add('wrong')});showFeedback(false,q,false)}saveState();renderStats();renderNav();renderQuestionList()}
function showFeedback(ok,q,removed){const box=document.getElementById('feedback');box.className='feedback '+(ok?'good':'bad');const extra=removed?`\n\n${UI.removedWrong}`:'';const currentAnswer=`本次正确选项：${displayLetterForKey(q.id,q.answer)}. ${q.options[q.answer]}\n\n`;box.innerHTML=ok?`<strong>${UI.correct}</strong><br>${escapeHtml(currentAnswer+q.explanation+extra)}`:`<strong>${UI.wrongMsg}</strong>`;document.getElementById('nextBtn').disabled=!ok} function escapeHtml(str){return String(str).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function renderNav(){const nav=document.getElementById('chapterNav');nav.innerHTML='';DATA.forEach(ch=>{const btn=document.createElement('button');btn.className=view.mode==='chapter'&&view.chapter===ch.chapter?'active':'';btn.innerHTML=`<span>${escapeHtml(ch.title).replace(' ','<br>')}</span><small>${(ch.questions||[]).length}${UI.questionUnit}</small>`;btn.onclick=()=>selectChapter(ch.chapter);nav.appendChild(btn)});const exam=document.createElement('button');exam.className='exam-tab '+(view.mode==='exam'?'active':'');exam.innerHTML=`<span>${UI.exam}</span><small>${EXAM_SIZE}${UI.questionUnit}</small>`;exam.onclick=selectExam;nav.appendChild(exam);const wrong=document.createElement('button');wrong.className='wrong-tab '+(view.mode==='wrong'?'active':'');wrong.innerHTML=`<span>${UI.wrongbook}</span><small>${state.wrongbook.length}${UI.questionUnit}</small>`;wrong.onclick=selectWrongbook;nav.appendChild(wrong);const starred=document.createElement('button');starred.className='star-tab '+(view.mode==='starred'?'active':'');starred.innerHTML=`<span>${UI.starred}</span><small>${state.starred.length}${UI.questionUnit}</small>`;starred.onclick=selectStarred;nav.appendChild(starred)}
function renderStats(){const qs=currentQuestions();const attempts=qs.reduce((n,q)=>n+statFor(q.id).attempts,0);const wrongs=qs.reduce((n,q)=>n+statFor(q.id).wrongs,0);const practiced=qs.filter(q=>statFor(q.id).attempts>0).length;const rate=attempts?Math.round(wrongs/attempts*100):0;document.getElementById('stats').innerHTML=`<div class="stat"><strong>${qs.length}</strong><span>${UI.statsQuestions}</span></div><div class="stat"><strong>${practiced}</strong><span>${UI.practiced}</span></div><div class="stat"><strong>${state.wrongbook.length}</strong><span>${UI.wrong}</span></div><div class="stat"><strong>${state.starred.length}</strong><span>${UI.starredStat}</span></div><div class="stat"><strong>${rate}%</strong><span>${UI.viewRate}</span></div>`}
function renderQuestionList(){ensureOrder();const list=document.getElementById('questionList');list.innerHTML='';view.order.forEach((id,i)=>{const q=getQuestion(id);if(!q)return;const btn=document.createElement('button');btn.className=i===view.index?'current':'';const star=isStarred(q.id)?'<span class="star-mark">★</span>':'';const streak=state.wrongbook.includes(q.id)?`<br><small>${UI.streak} ${wrongStreak(q.id)}/${WRONG_STREAK_TARGET}</small>`:'';btn.innerHTML=`<strong>${q.chapter}-${q.number}</strong>${star} <span class="rate">${errorRate(q.id)}%</span><br>${escapeHtml(q.question.slice(0,34))}${streak}`;btn.onclick=()=>goToIndex(i);list.appendChild(btn)})}
function viewTitleText(ch){if(view.mode==='wrong')return UI.wrongbook;if(view.mode==='starred')return UI.starred;if(view.mode==='exam')return UI.exam;return ch?ch.title:''}
function viewSubtitleText(ch){if(view.mode==='wrong')return UI.reviewWrong;if(view.mode==='starred')return UI.reviewStarred;if(view.mode==='exam')return UI.reviewExam;return ch&&ch.note?ch.note:''}
function emptyText(ch){if(view.mode==='wrong')return UI.emptyWrong;if(view.mode==='starred')return UI.emptyStarred;return ch&&ch.note?escapeHtml(ch.note):UI.emptyChapter}
function renderQuestion(){ensureOrder();const area=document.getElementById('questionArea');const ch=view.mode==='chapter'?chapterByNo(view.chapter):null;const currentQs=currentQuestions();document.getElementById('viewTitle').textContent=viewTitleText(ch);document.getElementById('viewSubtitle').textContent=viewSubtitleText(ch);document.getElementById('shuffleBtn').textContent=view.mode==='exam'?'重新抽题':'打乱题目';document.getElementById('shuffleBtn').disabled=currentQs.length<2;const optionShuffleBtn=document.getElementById('optionShuffleBtn');if(optionShuffleBtn)optionShuffleBtn.disabled=currentQs.length<1;if(!view.order.length){area.className='empty';area.innerHTML=emptyText(ch);document.getElementById('progressFill').style.width='0%';return}area.className='question-shell';const q=getQuestion(view.order[view.index]);const s=statFor(q.id);const starred=isStarred(q.id);const optionKeys=optionOrderFor(q.id);const streakInfo=state.wrongbook.includes(q.id)?` · ${UI.streak} ${wrongStreak(q.id)}/${WRONG_STREAK_TARGET}`:'';document.getElementById('progressFill').style.width=`${Math.round((view.index+1)/view.order.length*100)}%`;area.innerHTML=`<div class="question-meta"><span>${q.chapter}-${q.number}<span id="currentStarMark">${starred?'<span class="star-mark">★</span>':''}</span></span><span>${UI.rate} ${errorRate(q.id)}% · ${UI.wrongs} ${s.wrongs} / ${UI.attempts} ${s.attempts}${streakInfo}</span></div><div class="question-text">${escapeHtml(q.question)}</div><div class="options">${optionKeys.map((key,i)=>`<button class="option" data-key="${key}" onclick="answer('${key}')"><span class="letter">${letters[i]}</span><span class="text">${escapeHtml(q.options[key])}</span></button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="question-actions"><div class="left-actions"><button class="btn" onclick="prevQuestion()">${UI.previous}</button><button class="btn ${starred?'starred':''}" id="starBtn" onclick="toggleStar('${q.id}')">${starred?'★ '+UI.unmarkStar:'☆ '+UI.markStar}</button></div><button class="btn primary" id="nextBtn" onclick="nextQuestion()" disabled>${UI.next}</button></div>`}
function resetStats(){if(confirm(UI.confirmResetStats)){state.stats={};saveState();answeredCorrect=false;render()}}
function clearWrongbook(){if(confirm(UI.confirmClearWrong)){state.wrongbook=[];saveState();answeredCorrect=false;render()}}
function clearStarred(){if(confirm(UI.confirmClearStarred)){state.starred=[];saveState();answeredCorrect=false;render()}}
function render(){renderNav();renderQuestion();renderStats();renderQuestionList()} document.getElementById('shuffleBtn').onclick=shuffle;document.getElementById('optionShuffleBtn').onclick=shuffleOptions;document.getElementById('resetStatsBtn').onclick=resetStats;document.getElementById('clearWrongBtn').onclick=clearWrongbook;document.getElementById('clearStarredBtn').onclick=clearStarred;render();
</script>
